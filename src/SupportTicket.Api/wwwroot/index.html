<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan • Hỗ trợ khách hàng</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b2545'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Segoe UI,Arial' font-size='26' font-weight='700' fill='%232dd4bf'%3EST%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <div class="main-area">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="page-content">
        <section class="hero-panel mb-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
              <span class="role-badge" id="hero-role">Đang tải...</span>
              <h1 id="hero-greeting">Xin chào</h1>
              <p id="hero-sub">Đang tải số liệu từ hệ thống...</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <a href="new-ticket.html" class="btn btn-primary d-inline-flex align-items-center gap-2">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                Tạo yêu cầu
              </a>
              <a href="tickets.html" class="btn btn-outline-light">Xem danh sách</a>
            </div>
          </div>
        </section>

        <div id="dashboard-alert" aria-live="polite"></div>

        <div id="stat-grid" class="stat-grid mb-4" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>

        <div class="row g-4">
          <div class="col-xl-8">
            <div class="card-panel h-100">
              <div class="card-panel-header">
                <h2>Yêu cầu cập nhật gần đây</h2>
                <a class="ms-auto small fw-semibold" href="tickets.html">Xem tất cả</a>
              </div>
              <div id="recent-list" aria-live="polite">
                <div class="p-3">
                  <div class="skeleton skeleton-line" style="width:80%"></div>
                  <div class="skeleton skeleton-line" style="width:60%"></div>
                  <div class="skeleton skeleton-line" style="width:70%"></div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-xl-4">
            <div class="card-panel mb-4">
              <div class="card-panel-header"><h2>Phân bố theo danh mục</h2></div>
              <div class="card-panel-body" id="category-chart">
                <div class="skeleton skeleton-line" style="width:85%"></div>
                <div class="skeleton skeleton-line" style="width:65%"></div>
                <div class="skeleton skeleton-line" style="width:75%"></div>
              </div>
            </div>
            <div class="card-panel">
              <div class="card-panel-header"><h2>Mức ưu tiên</h2></div>
              <div class="card-panel-body" id="priority-chart">
                <div class="skeleton skeleton-line" style="width:85%"></div>
                <div class="skeleton skeleton-line" style="width:65%"></div>
                <div class="skeleton skeleton-line" style="width:75%"></div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="toast-container-custom" id="toast-container" aria-live="polite"></div>

  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="vendor/signalr.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/dashboard.js"></script>
</body>
</html>
